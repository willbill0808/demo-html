<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your-Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>
    <nav>
        <button class="nav_knapper" id="homepage_knapp" onclick="window.location.href='home.html'">
            <h2>Homepage</h2>
        </button>
        <button class="nav_knapper" id="handle-kurv_knapp" onclick="window.location.href='handlekurv.html'">
            <h2>Handle kurv</h2>
        </button>
        <button class="nav_knapper" id="sign-in_knapp" onclick="window.location.href='sign-in.html'">
            <h2>Sign in</h2>
        </button>
        <button class="nav_knapper" id="log-in_knapp" onclick="window.location.href='log-in.html'">
            <h2>log in</h2>
        </button>
        <img class="nav_knapper" id="profile-nav-img" src="assets/profile.png" alt="" onclick="window.location.href='profile.html'">
    </nav>

    <main>
        <img id="profile-img" src="assets/profile.png" alt="">

        <div id="profile_info">
            <div id="profile_navn" class="info_box">
                <h2>Navn:</h2>
                <h3>Greg</h3>
            </div>
            <div id="profile_etternavn" class="info_box">
                <h2>Etternavn:</h2>
                <h3>Richardsen</h3>
            </div>
            <div id="adresse" class="info_box">
                <h2>Adresse:</h2>
                <h3>12a bakers street</h3>
            </div>
        </div>

        <div id="credit-card_info">
            <div id="card_number" class="info_box">
                <h2>Card-Nr:</h2>
                <h3>1234 5678 2255 3366</h3>
            </div>
            <div id="name_on_card" class="info_box">
                <h2>Name On Card:</h2>
                <h3>Greg K. Richardsen</h3>
            </div>
            <div id="card_adress" class="info_box">
                <h2>Card Adress:</h2>
                <h3>12a bakers street</h3>
            </div>
        </div>
    </main>

    <footer></footer>
</body>

</html>
